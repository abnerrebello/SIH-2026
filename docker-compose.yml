services:
  db:
    image: postgres:17-alpine
    container_name: aegispath-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegispath
      POSTGRES_USER: aegispath
      POSTGRES_PASSWORD: aegispath_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegispath -d aegispath"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: aegispath-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://aegispath:aegispath_dev@db:5432/aegispath
      SECRET_KEY: development-secret-change-later
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: aegispath-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data: {}